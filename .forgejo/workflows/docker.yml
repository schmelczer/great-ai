name: Publish container image on Forgejo

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
env:
  REGISTRY: git.schmelczer.dev

jobs:
  publish:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and publish in rootless sandbox
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@10ab5db88c5f6fc1d2a368ce0ea934807f7ebfca
        with:
          context: .
          push: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          token: ${{ ((github.ref == 'refs/heads/main' || github.ref_type == 'tag')) && secrets.DOCKER_PACKAGE_TOKEN || '' }}
          platforms: linux/amd64,linux/arm64
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
