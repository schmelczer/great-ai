name: Publish container image on Forgejo

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  REGISTRY: git.schmelczer.dev

jobs:
  publish:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The `docker` runner image is node-based and may not ship the docker CLI
      # that the docker/* actions below drive; install it idempotently, as the
      # sibling repos do for their Docker jobs.
      - name: Build and publish in rootless sandbox
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@a415e2a50992af99b7b6dd3f02cca372d87b11f6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (true) }}
          token: ${{ secrets.DOCKER_PACKAGE_TOKEN }}
          platforms: linux/amd64,linux/arm64
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
