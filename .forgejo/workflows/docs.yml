name: Publish documentation to great-ai.schmelczer.dev

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'great_ai/**'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - '.forgejo/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'great_ai/**'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - '.forgejo/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The mkdocs git-revision-date plugin reads each page's git history.
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install '.[dev]'

      - name: Build documentation
        run: |
          . .venv/bin/activate
          mkdocs build

      # As in reconcile, publish through the shared action to /pages/great-ai,
      # served at https://great-ai.schmelczer.dev.
      - name: Upload static site artifact 1
        if: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-publish-0
          path: site
          if-no-files-found: error
          retention-days: 1
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
  publish-pages:
    name: Deploy static site artifacts
    needs: publish
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') && (((github.event_name
      == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) }}
    runs-on: pages
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
      volumes:
        - /pages/great-ai:/pages/great-ai
    concurrency:
      group: pages-deploy-great-ai
      cancel-in-progress: false
    steps:
      - name: Download static site artifact 1
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: pages-publish-0
          path: site
      - name: Deploy to great-ai.schmelczer.dev
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: https://git.schmelczer.dev/andras/ci-actions/deploy-pages@18419c79a58572be1bb3759b334f43306be44a29
        with:
          source: site
          target: great-ai
