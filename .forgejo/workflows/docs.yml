name: Publish documentation to great-ai.schmelczer.dev

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'great_ai/**'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - '.forgejo/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'great_ai/**'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - '.forgejo/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ (github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') || startsWith(github.head_ref,
      'renovate/')) && 'renovate' || 'docker' }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The mkdocs git-revision-date plugin reads each page's git history.
          fetch-depth: 0

          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install '.[dev]'

      - name: Build documentation
        run: |
          . .venv/bin/activate
          mkdocs build

      # As in reconcile, publish through the shared action to /pages/great-ai,
      # served at https://great-ai.schmelczer.dev.
      - name: Upload static site artifact 1
        if: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-publish-0
          path: site
          if-no-files-found: error
          retention-days: 1
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) }}
