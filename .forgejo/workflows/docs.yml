name: Publish documentation to great-ai.schmelczer.dev

on:
  push:
    branches:
      - "**"
    paths:
      - docs/**
      - great_ai/**
      - mkdocs.yaml
      - pyproject.toml
      - .forgejo/workflows/docs.yml
  workflow_dispatch:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install '.[dev]'
      - name: Build documentation
        run: |
          . .venv/bin/activate
          mkdocs build
      - name: Upload static site artifact 1
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-publish-0
          path: site
          if-no-files-found: error
          retention-days: 1
